<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
(function () {
  var payload = <?!= payloadJson ?>;
  var reqId = <?!= reqIdJson ?>;
  var action = <?!= actionJson ?>;
  var slim = <?!= slimJson ?>;
  var token = <?!= tokenJson ?>;
  function parentOrigin() {
    try {
      if (document.referrer) return new URL(document.referrer).origin;
    } catch (e) {}
    return 'https://pongvitsam.github.io';
  }
  function send(p) {
    var msg = { source: 'DrugInventoryGAS', reqId: reqId, payload: p };
    var origin = parentOrigin();
    try { window.top.postMessage(msg, origin); } catch (e) {}
    try { window.parent.postMessage(msg, origin); } catch (e2) {}
  }
  if (payload) {
    send(payload);
    return;
  }
  var runner = google.script.run
    .withSuccessHandler(send)
    .withFailureHandler(function (err) {
      send({ ok: false, error: String(err && err.message ? err.message : err) });
    });
  if (action === 'export') runner.gasExport({ slim: !!slim, token: token });
  else if (action === 'meta') runner.gasMeta({ token: token });
  else runner.gasPing();
})();
</script>
</body>
</html>
